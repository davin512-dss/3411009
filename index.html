<!DOCTYPE html>
<!-- lang es para lenguaje es = español-->
<html lang="es">
<head>
    <!--utf -8 es hora colombiana-->
    <meta charset="UTF-8">
    <!-- meta name=..... es para que la pagina sea de la escala de la pantalla-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--title es el encabezado de la pagina-->
    <title>Iniciar sesion de inventario ADSO</title>
    <link href="css/estilos.css" rel="stylesheet">
    <!--llama los estilos persolanizados-->
</head>
<body class="login-fondo">
    <class="login-card"><!--contenido principal de la pagina-->
    <header class="login-encabezado"><!--encabezado de logion-->

        <!--icono de la tienda-->
        <i class="bi bi-shop display-4 text-sena"></i>


    <h1 class="h3 fw-bold">Inventario Sena</h1><!--h# es para titulos-->
    <p class="text-secondary mb-0">Ingresa tus credenciales para continuar</p>
    </header>

    <form action="dashboard.html" method="get">

<!--form permite crear el contenido de un formulario cuando se envia nos lleva a la ruta(dashboard)-->
<!--method con envia la informacion con get-->

<div class="form-floating mb-3"><!--div permite agrupar un contenido en un contenedor-->


<input type="email" class="form-control" placeholder="sena@correo.com" required>
    <!--type obliga que tenga el@, placeholder el texto de ejemplo required es q es un campo obligatorio-->

<label for="correo"><i class="bi-envelope me-1"></i> correo electronico</label>
<!--label es una etiqueta de texto que con el for conecta con el input-->

</div>

<div class="from-floating mb-3">

<input type="password" class="form-control" id="clave" placeholder="minimo 6 caracteres" minlength="6" required>
    <label for="clave"><i class="bi bi-lock me-1"></i> contraseña</label>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

<div class="form-check">

<input class="form-check-input" type="checkbox" id="recordar">
<label class="form-check-label" for="recordar">recordarme</label><!-- type checkbox es caslla de verificacion-->


</div>

<p class="login-pie">¿no tienes cuenta?<a href="registro.html" class="text-decoration-none">registrate mi amorrrrrr</a></p>


<button type="subimit" class="btn btn-sena w-100 py-2 fw-semibold">
   <i class="bi bi-box-arrow-in-right me-1"> </i> ingresar </button>  <!--envia el formulario antes revisa los campos required email y minlengt-->


    </form><!--cierra el formulario-->


    <a href="#" class="small text-decoration-none"> Olvidaste tu contraseña???????</a>

    </div>



<footer class="login-pie">2026 SENA - ADSO Mixtape</footer>
<!--es el pie de la pagina-->
</main>
